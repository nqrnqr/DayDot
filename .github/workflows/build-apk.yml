name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Compute version and OTA manifest URL
        id: meta
        run: |
          VERSION="1.0.${{ github.run_number }}"
          OTA_MANIFEST="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ota/latest.json"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ota_manifest=${OTA_MANIFEST}" >> "$GITHUB_OUTPUT"

      - name: Build web assets for Capacitor
        env:
          BASE_PATH: /
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_OTA_MANIFEST_URL: ${{ steps.meta.outputs.ota_manifest }}
        run: npm run build

      - name: Add Capacitor Android project and icons
        run: |
          npx cap add android
          node scripts/setup-android-icons.mjs

      - name: Decode permanent release keystore (if configured in Secrets)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANDROID_KEYSTORE_* secrets not set; falling back to debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch Gradle version and signing config
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/configure-android-signing.mjs
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect APK artifact
        run: |
          mkdir -p release-apk
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/DayDot-android.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/DayDot-android.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayDot-android-apk
          path: release-apk/DayDot-android.apk
          retention-days: 30

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/DayDot-android.apk
