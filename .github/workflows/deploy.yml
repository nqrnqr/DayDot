name: Deploy DayDot to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute version and OTA URLs
        id: meta
        run: |
          VERSION="1.0.${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          PAGES_BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "ota_manifest=${PAGES_BASE}/ota/latest.json" >> "$GITHUB_OUTPUT"
          echo "ota_zip=${PAGES_BASE}/ota/bundle.zip" >> "$GITHUB_OUTPUT"

      - name: Build PWA for GitHub Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_OTA_MANIFEST_URL: ${{ steps.meta.outputs.ota_manifest }}
        run: npm run build

      - name: Build Android OTA hot-update bundle
        env:
          BASE_PATH: /
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_OTA_MANIFEST_URL: ${{ steps.meta.outputs.ota_manifest }}
        run: |
          npx vite build --outDir dist-ota
          mkdir -p dist/ota
          (cd dist-ota && zip -rq ../dist/ota/bundle.zip .)
          cat <<EOF > dist/ota/latest.json
          {
            "version": "${{ steps.meta.outputs.version }}",
            "commit": "${{ steps.meta.outputs.short_sha }}",
            "url": "${{ steps.meta.outputs.ota_zip }}",
            "updatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
